# _______________________
# Borders
  set -g pane-border-style 'fg=#3D3D5C' # Inactive panes
  set -g pane-active-border-style 'fg=#BB9AF7' # Active window/pane
  set -g pane-border-indicators colour
  set -g pane-border-status bottom
  set -g pane-border-lines single
  set -g pane-border-format ""
  set -g status-position bottom
 
# _______________________
# statusbar left
  set -g status-justify left
  set -g status-left ''
  set -g status-left-length 15

# _______________________
# General style
  set -gw window-style 'fg=default bg=default' # Colours for inactive panes
  set -gw status-style 'fg=default bg=default' 
# unfocused windows
  set -gw window-status-style 'fg=#6E6A8A bg=default'
  set -gw window-status-format ' #I.#W '
# Active windows
  set -gw window-status-current-style 'fg=#BB9AF7 bg=default bold'
  set -gw window-status-current-format '#I.#[fg=#02AF87]#W '

# _______________________
# Notification alerts
  set -g message-style 'fg=#BB9AF7 bg=default'  # The Notification
  set -g window-status-activity-style 'fg=#F4A7B9 bg=default bold'
  set -g monitor-activity on

# _______________________
# Alerts - general settings
  set -g visual-activity off
  set -g visual-bell off
  set -g visual-silence off
  set -g bell-action none
  #set -g window-status-bell-style 'fg=# bg=default bold'

# _______________________
# statusbar right
  set -g status-right-style 'fg=#BB9AF7 bg=default bold'
  set -g status-right-length 15
  set -g status-right '#{session_name} | %H:%M'
 
# _______________________
# clock mode - keeping that purple
  set -gw clock-mode-colour '#02AF87'

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left false

# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon "󰊓 "

# on all tabs (default is false)
# false will make it visible for the current tab only
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true
  # To add or remove extra text in status bar
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra ""

# To make the selection box rounded () or edged <>
# Default is nothing, when set to true default is edged
set -g @minimal-tmux-use-arrow false
set -g @minimal-tmux-right-arrow "  "
set -g @minimal-tmux-left-arrow "  "
