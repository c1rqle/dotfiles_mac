# git commands

matches:
  - trigger: "gits"
    replace: "git status"

  - trigger: "git."
    replace: "git add $|$ "

  - trigger: "gitp"
    replace: "git push"

  - trigger: "gitc"
    replace: "git commit -m '$|$'"
    word: true

  - trigger: "gitco"
    replace: "git -C /Users/tb/dotfiles_mac add . && git -C /Users/tb/dotfiles_mac commit -m '$|$' "
    word: true

  - trigger: "gitmain"
    replace: "git checkout main"
    word: true

  - trigger: "gittest"
    replace: "git checkout test"
    word: true
