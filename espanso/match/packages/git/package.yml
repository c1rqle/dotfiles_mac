# git commands

matches:
  - trigger: "gstat"
    replace: "git status"

  - trigger: "git."
    replace: "git add $|$ "

  - trigger: "gpush"
    replace: "git push"

  - trigger: "gitc"
    replace: "git commit -m '$|$'"

  - trigger: "git.c"
    replace: "git -C /Users/tb/dotfiles_mac add . && git -C /Users/tb/dotfiles_mac commit -m '$|$' "

  - trigger: "gitmain"
    replace: "git checkout main"
    word: true

  - trigger: "gittest"
    replace: "git checkout test"
    word: true
