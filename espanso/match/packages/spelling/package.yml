# Spelling

  matches:

  - trigger: "iam"
    replace: "I'm"

  - trigger: "iwill"
    replace: "I'll"

  - trigger: "wewill"
    replace: "we'll"
    propagate_case: true

  - trigger: "weare"
    replace: "we're"
    propagate_case: true

  - trigger: "its"
    replace: "it's"
    propagate_case: true

  - trigger: "youll"
    replace: "you'll"
    propagate_case: true

  - trigger: "whatis"
    replace: "what's"
    propagate_case: true

  - trigger: "youre"
    replace: "you're"
    propagate_case: true

  - trigger: "yall"
    replace: "y'all"
    propagate_case: true

  - trigger: "dissapear"
    replace: "disappear"
    propagate_case: true

  - trigger: "definately"
    replace: "definitely"
    propagate_case: true

  - trigger: "deffi"
    replace: "definitely"
    propagate_case: true

  - trigger: "calender"
