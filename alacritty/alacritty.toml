#    "~/.config/alacritty/themes/themes/ayu_dark.toml"

general.import = ["/home/tb/.config/alacritty/themes/themes/aura.toml"]

# Reload this config on save
general.live_config_reload = true

[env]
TERM = "Alacritty"

[window]
title = "Alacritty"
decorations = "transparent"
decorations_theme_variant = "Dark"
dynamic_padding = true
dynamic_title = true
opacity = 0.92
startup_mode = "Windowed"
blur = true
resize_increments = false
option_as_alt = "OnlyRLeft"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 20
y = 20

[scrolling]
history = 30000

[font]
builtin_box_drawing = true
size = 18

[font.normal]
family = "OperatorMono Nerd Font"
style = "Book"

[font.italic]
family = "OperatorMono Nerd Font"
style = "Book Italic"

[font.bold]
family = "OperatorMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "OperatorMono Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 5
y = 1

[font.offset]
x = 3
y = 6

[bell]
animation = "EaseOutExpo"
color = "#C0C5CE"
command = "None"
duration = 0

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 560
unfocused_hollow = true
thickness = 0.15

vi_mode_style = { shape = "Beam" }

[mouse]
hide_when_typing = false

#[[hints.enabled]]
##  command           = "xdg-open" # On Linux/BSD
#hyperlinks = true
#post_processing = true
#persist = false
#mouse.enabled = true
#binding = { key = "O", mods = "Control|Shift" }
#  regex		          = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
#
[debug]
log_level = "Warn"
print_events = false
render_timer = false
highlight_damage = false
persistent_logging = false
